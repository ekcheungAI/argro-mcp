[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argro-backend"
version = "0.1.0"
description = "Argro MCP backend - AI news aggregation platform"
readme = { text = "Argro backend", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "feedparser",
    "langdetect",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
